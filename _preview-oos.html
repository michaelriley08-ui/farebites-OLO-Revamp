    <title>FareBites – Out-of-Stock Preview (Internal)</title>
    <!--
      INTERNAL QA HARNESS — excluded from the live deployment via .vercelignore.

      Renders the real menu page against seeded data so the out-of-stock
      treatment can be reviewed without waiting for the live API to actually
      return an unavailable item. Three items below are flagged
      isAvailable:false; the first is left in stock for comparison.

      The data is real i-Tea content (location 9, Oakland — Milk Tea Specialty,
      category 1236), so what you see matches the production brand. Item IDs and
      prices were taken from the live dev API on 2026-08-30.

      HEADS-UP: seeding writes to "farebitesMockupState", the same key the real
      app uses, so loading this page replaces your current cart and selected
      store. Use clear-token.html afterwards to reset.
    -->
    <script>
      // Seed state BEFORE app.js runs its own init, so it never redirects
      // to the location picker or overwrites our seeded menu with a live fetch.
      var seedState = {
        selectedLocationId: 9,
        selectedLocation: "i-Tea - Oakland",
        selectedAddress: "388 9th St, Oakland, CA 94607",
        selectedDistance: "0.0 mi",
        fulfillmentMode: "In-store",
        orderTime: "ASAP",
        isLoading: false,
        menuItemsLoadError: false,
        menuTab: "menu",
        cart: [],
        cartItemCount: 0,
        bagQuantity: 0,
        noBagsSelected: false,
        apiCategories: [
          { categoryId: 1236, name: "Milk Tea Specialty", imgUrl: "images/no-product-pic.png" }
        ],
        apiMenuItems: [
          { id: 14331, name: "B1 Signature Boba Milk Tea", description: "23 calories to 357 calories", price: 4.95, image: "images/no-product-pic.png", category: "Milk Tea Specialty", categoryId: 1236, isAvailable: true },
          { id: 14332, name: "B2 Milk Tea with Pudding", description: "255 calories to 378 calories", price: 4.95, image: "images/no-product-pic.png", category: "Milk Tea Specialty", categoryId: 1236, isAvailable: false },
          { id: 14335, name: "B5 3G Milk Tea", description: "Comes with Boba, Pudding, and Grass Jelly (226 calories to 349 calories)", price: 5.75, image: "images/no-product-pic.png", category: "Milk Tea Specialty", categoryId: 1236, isAvailable: false },
          { id: 14336, name: "B6 Matcha Milk Tea", description: "Comes with Matcha Pudding and Red Bean (306 calories to 383 calories)", price: 5.25, image: "images/no-product-pic.png", category: "Milk Tea Specialty", categoryId: 1236, isAvailable: false }
        ]
      };
      sessionStorage.setItem("farebitesMockupState", JSON.stringify(seedState));
      localStorage.setItem("farebitesMockupState", JSON.stringify(seedState));
    </script>
